control:
  # 控制频率
  rate: 30.0

  # 凝聚参数
  r_safe: 0.5           # 安全半径
  r_pack: 2.1           # 堆积半径因子
  phi_sc: 0.523         # pi/6
  p_cohe: 1.5           # 凝聚增益

  # 对齐参数
  a_max: 5.0            # 最大加速度
  v_max: 1.5            # 最大速度
  dv_max: 0.167         # a_max / control_rate
  r_align: 10.0         # 对齐有效半径
  p_align: 0.6           # 对齐增益

  # 分离参数
  b: 1.0                # 半短轴
  r_sen: 5.0            # 感知半径
  e_max: 0.95           # 最大离心率
  p_sepa_quad: 0.3      # 无人机分离增益
  p_sepa_obs: 0.05     # 障碍分离增益

  # 跟随参数
  target_height: 2.0  # 目标高度
  kp_flock_z: 0.5       # 高度增益
  max_climb_vel: 1.0    # 最大爬升速度

  # 编队形成参数
  vel_form: 1.0          # 编队形成速度
  kp_form: 0.5          # 编队位置P增益
  kd_form: 0.1          # 编队位置D增益
  min_height: 2.0        # 最小飞行高度

leader:
  name: "UAV6"
  submode_channel: 6   # 子模式切换通道 1-based 通道号 (6对应RC通道6)
  leader_topics:
    - {name: mavros/rc/in,                   type: mavros_msgs/RCIn}
    - {name: leader_gp_origin,               type: sensor_msgs/NavSatFix}
  leader_height: 5.0   # leader 高度
  circle_center: [10.0, 0.0]   # leader 圆轨迹中心
  circle_radius: 10.0   # leader 圆轨迹半径
  circle_speed: 0.5   # leader 圆轨迹速度
  clockwise: true   # leader 圆轨迹是否顺时针飞行
  hover_on_start: true   # 启动时悬停

topics:
  - {name: mavros/state,                   type: mavros_msgs/State}
  - {name: mavros/time_reference,          type: sensor_msgs/TimeReference}
  - {name: mavros/local_position/odom,     type: nav_msgs/Odometry}

topology:
  UAV6: []
  UAV7: [UAV8, UAV9]
  UAV8: [UAV7, UAV9]
  UAV9: [UAV7, UAV8]

init_position: # 相对leader的初始位置 ENU
  UAV6: []
  UAV7: [1.0, 0.0, -2.0]    # 跟随者1初始位置
  UAV8: [0.0, 1.732, -2.0]  # 跟随者2初始位置（等边三角形编队）
  UAV9: [0.0, -1.732, -2.0] # 跟随者3初始位置（等边三角形编队）
