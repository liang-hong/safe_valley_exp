control:
  # 控制频率
  rate: 30.0

  # 凝聚参数
  r_safe: 0.45           # 安全半径
  r_pack_gain: 2.1      # 堆积半径因子 (r_pack = r_pack_gain * r_safe)
  phi_sc: 0.52359877559 # 空间利用率 (pi/6)
  p_cohe: 1.0           # 凝聚增益

  # 对齐参数
  a_max: 10.0            # 最大加速度
  v_max: 2.0            # 最大速度
  r_align: 5.0         # 对齐有效半径
  p_align: 0.3           # 对齐增益

  # 分离参数
  b: 1.0                # 半短轴
  r_sen: 5.0            # 感知半径
  e_max: 0.95           # 最大离心率
  p_sepa_quad: 0.3      # 无人机分离增益
  p_sepa_obs: 0.5     # 障碍分离增益

  # 跟随参数
  target_height: 6.0  # 目标高度
  kp_flock_z: 0.5       # 高度增益
  max_climb_vel: 1.0    # 最大爬升速度

  # 编队形成参数
  vel_form: 0.5          # 编队形成速度
  kp_form: 0.5          # 编队位置P增益
  kd_form: 0.1          # 编队位置D增益
  min_height: 1.0        # 最小飞行高度

  # 安全校验参数
  min_gps_status: 0     # 最小 GPS 状态要求: -1=无固定, 0=普通固定, 1=SBAS, 2=RTK 固定 (仿真建议0, 实机建议2)

leader:
  name: "UAV6"
  submode_channel: 8   # 子模式切换通道 1-based 通道号 (8对应RC通道8)
  leader_topics:
    - {name: mavros/rc/in,                   type: mavros_msgs/RCIn}
    - {name: leader_fix_origin,               type: sensor_msgs/NavSatFix}
  leader_height: 8.0   # leader 高度
  circle_center: [5.0, 0.0]   # leader 圆轨迹中心
  circle_radius: 5.0   # leader 圆轨迹半径
  circle_speed: 0.5   # leader 圆轨迹速度
  clockwise: true   # leader 圆轨迹是否顺时针飞行
  hover_on_start: true   # 启动时悬停

topics:
  - {name: mavros/state,                   type: mavros_msgs/State}
  - {name: mavros/time_reference,          type: sensor_msgs/TimeReference}
  - {name: mavros/local_position/odom,     type: nav_msgs/Odometry}

topology:
  UAV6: []
  UAV7: [UAV9, UAV10]
  UAV9: [UAV7, UAV10]
  UAV10: [UAV7, UAV9]

init_position: # 相对leader的初始位置 ENU
  UAV6: []
  UAV7: [2.0, 0.0, -2.0]    # 跟随者1初始位置
  UAV9: [0.0, 1.732, -2.0]  # 跟随者2初始位置（等边三角形编队）
  UAV10: [0.0, -1.732, -2.0] # 跟随者3初始位置（等边三角形编队）
